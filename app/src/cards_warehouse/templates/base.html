<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <!-- The page as wide as the phone's screen, not a desktop page shrunk to fit it. -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Magazzino{% endblock %}</title>
  <style>
    :root { color-scheme: light dark; --accent: #2563eb; --line: #8884; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 1rem/1.5 system-ui, sans-serif; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 1rem;
             padding: .5rem 1rem; border-bottom: 1px solid var(--line); }
    header a { font-weight: 600; color: inherit; text-decoration: none; }
    header nav { display: flex; gap: 1rem; margin-right: auto; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: .5rem .25rem; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
    .number { text-align: right; }
    .tag { display: inline-block; padding: 0 .375rem; border-radius: .25rem; font-size: .875rem;
           background: #f59e0b33; white-space: nowrap; }
    /* A price at a loss: more evident than a margin below the target. */
    .tag.loss { background: #dc2626; color: #fff; font-weight: 600; }
    main { max-width: 40rem; margin: 0 auto; padding: 1rem; }
    label { display: block; margin-bottom: .25rem; }
    /* At least 16px: a smaller text field makes the phone zoom in when it gets the focus.
       At least 44px high: the smallest target a finger hits without aiming. */
    input, select, textarea, button { font: inherit; font-size: max(1rem, 16px); min-height: 2.75rem; }
    input, select, textarea { width: 100%; padding: .5rem; margin-bottom: 1rem; }
    .check { display: flex; align-items: center; gap: .5rem; min-height: 2.75rem; margin-bottom: 1rem; }
    .check input { width: 1.5rem; min-height: 1.5rem; margin: 0; }
    summary { padding: .625rem 0; cursor: pointer; }
    button, .button { padding: .5rem 1rem; border: 0; border-radius: .375rem; background: var(--accent); color: #fff; }
    .button { display: inline-flex; align-items: center; min-height: 2.75rem; text-decoration: none; }
    .error { color: #dc2626; font-weight: 600; }
    /* The photos of an item, as wide as the screen, with their buttons below. */
    figure { margin: 0 0 1.5rem; }
    figure img { display: block; width: 100%; height: auto; border-radius: .375rem; }
    figure form { display: inline-flex; gap: .5rem; margin: .5rem .5rem 0 0; }
    .danger { background: #dc2626; }
    /* The load and edit pages ask only for the fields of the kind chosen, and of the card graded or not. */
    .load [data-for] { display: none; }
    .load:has(#kind [value=single_card]:checked) [data-for~=single_card],
    .load:has(#kind [value=sealed]:checked) [data-for~=sealed] { display: block; }
    .load:has(#graded:checked) [data-graded=no],
    .load:has(#graded:not(:checked)) [data-graded=yes] { display: none; }
  </style>
</head>
<body>
  <header>
    <a href="/">Magazzino</a>
    {% if request.session.get("signed_in") %}
      <nav><a href="/items">Articoli</a><a href="/purchases">Acquisti</a><a href="/channels">Canali</a><a href="/lives">Live</a><a href="/ebay">eBay</a></nav>
      <form method="post" action="/logout"><button type="submit">Esci</button></form>
    {% endif %}
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
