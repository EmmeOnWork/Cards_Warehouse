<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <!-- The page as wide as the phone's screen, not a desktop page shrunk to fit it. -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Magazzino{% endblock %}</title>
  <style>
    :root { color-scheme: light dark; --accent: #2563eb; --line: #8884; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 1rem/1.5 system-ui, sans-serif; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 1rem;
             padding: .5rem 1rem; border-bottom: 1px solid var(--line); }
    header a { font-weight: 600; color: inherit; text-decoration: none; }
    main { max-width: 40rem; margin: 0 auto; padding: 1rem; }
    label { display: block; margin-bottom: .25rem; }
    /* At least 16px: a smaller text field makes the phone zoom in when it gets the focus.
       At least 44px high: the smallest target a finger hits without aiming. */
    input, button { font: inherit; font-size: max(1rem, 16px); min-height: 2.75rem; }
    input { width: 100%; padding: .5rem; margin-bottom: 1rem; }
    button { padding: .5rem 1rem; border: 0; border-radius: .375rem; background: var(--accent); color: #fff; }
    .error { color: #dc2626; font-weight: 600; }
  </style>
</head>
<body>
  <header>
    <a href="/">Magazzino</a>
    {% if request.session.get("signed_in") %}
      <form method="post" action="/logout"><button type="submit">Esci</button></form>
    {% endif %}
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
