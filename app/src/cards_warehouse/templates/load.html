{% extends "base.html" %}

{% block title %}Carica · Magazzino{% endblock %}

{% block content %}
  <h1>Carica un articolo</h1>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/items">
    <label for="kind">Tipo</label>
    <select id="kind" name="kind">
      {% for kind in loadable %}
        <option value="{{ kind }}"{% if form.kind == kind %} selected{% endif %}>{{ kinds[kind] }}</option>
      {% endfor %}
    </select>

    <label for="game">Gioco</label>
    <select id="game" name="game">
      {% for game in games %}
        <option{% if form.game == game %} selected{% endif %}>{{ game }}</option>
      {% endfor %}
    </select>
    <label for="new_game">Oppure un gioco nuovo</label>
    <input id="new_game" name="new_game" placeholder="Topps" value="{{ form.new_game }}">

    <label for="name">Nome</label>
    <input id="name" name="name" value="{{ form.name }}" required>

    <label for="language">Lingua</label>
    <select id="language" name="language">
      {% for code, label in languages.items() %}
        <option value="{{ code }}"{% if form.language == code %} selected{% endif %}>{{ label }}</option>
      {% endfor %}
    </select>

    <label for="quantity">Copie</label>
    <input id="quantity" name="quantity" type="number" inputmode="numeric" min="1" value="{{ form.quantity }}" required>

    <label for="unit_cost">Costo di una copia, in euro</label>
    <input id="unit_cost" name="unit_cost" inputmode="decimal" placeholder="12,50" value="{{ form.unit_cost }}">
    <label class="check">
      <input type="checkbox" name="unknown_cost"{% if form.unknown_cost %} checked{% endif %}>
      Costo sconosciuto
    </label>

    <label for="location">Posizione, se vuoi</label>
    <input id="location" name="location" placeholder="Scatola 3" value="{{ form.location }}">

    <label for="notes">Note, se vuoi</label>
    <textarea id="notes" name="notes" rows="3">{{ form.notes }}</textarea>

    <button type="submit">Carica</button>
  </form>
{% endblock %}
