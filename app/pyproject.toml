[project]
name = "cards-warehouse"
version = "0.1.0"
description = "Multichannel inventory for trading cards"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "boto3>=1.43.118",
    "fastapi>=0.143.1",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "psycopg[binary]>=3.3.6",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.1.6",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = ["acceptance: builds, pulls, runs or scans Docker images, needs a running Docker daemon"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Errors, undefined names, import order, outdated syntax, likely bugs.
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "hypothesis>=6.170.9",
    "pytest>=9.1.1",
    "ruff==0.16.10",
]
