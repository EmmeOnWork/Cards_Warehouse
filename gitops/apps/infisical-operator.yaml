# The Infisical operator: it copies secrets from Infisical Cloud into Kubernetes Secrets.
# Two sources: its official Helm chart, at a pinned version, from Infisical's Helm repository, and the folder
# gitops/infisical of this repository, which tells the operator where Infisical is.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infisical-operator
  namespace: argocd
  # Deleting this Application also deletes the operator, instead of leaving it running.
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://dl.cloudsmith.io/public/infisical/helm-charts/helm/charts/
      chart: secrets-operator
      targetRevision: 0.11.12 # operator v0.11.12, released on 2026-10-16
      helm:
        valuesObject:
          # The chart would create the connection as a Helm hook, which Argo CD creates only once the operator
          # runs, then modifies. On new clusters, on 2026-10-21 and 2026-10-23, the operator never made it ready,
          # and no secret reached the cluster. gitops/infisical declares it instead, applied with the CRDs.
          defaultInfisicalConnection:
            enabled: false
    - repoURL: https://github.com/EmmeOnWork/Cards_Warehouse.git
      targetRevision: production
      path: gitops/infisical
  destination:
    server: https://kubernetes.default.svc
    # Created by Terraform, with the credential the operator signs in with (infra/platform/infisical.tf).
    namespace: infisical
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # Argo CD never tries a failed revision again on its own: on 2026-10-19 one failed sync left the operator
    # uninstalled for two days. Retry, as the app's and Velero's Applications do.
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
