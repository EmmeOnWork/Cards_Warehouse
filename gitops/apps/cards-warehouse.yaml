# The app: Argo CD renders the Helm chart in chart/ at the commit production points at, with the image of that commit.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cards-warehouse
  namespace: argocd
  # Deleting this Application also deletes what it installed, instead of leaving it running.
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/EmmeOnWork/Cards_Warehouse.git
    # The last commit the pipeline checked and published an image for: chart and image come from it.
    targetRevision: production
    path: chart
    helm:
      parameters:
        # The commit Argo CD reads, substituted by Argo CD itself: the image the pipeline built from it.
        - name: image.tag
          value: $ARGOCD_APP_REVISION
  destination:
    server: https://kubernetes.default.svc
    namespace: cards-warehouse
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # On a new cluster this Application can sync before the Infisical operator has installed the kinds
    # the chart uses, and the sync fails. Argo CD never tries a failed revision again on its own: retry.
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
