# Velero's AWS credential: the key of the scoped user cards-warehouse-app (infra/foundations), kept in
# Infisical's /aws folder. The Infisical operator writes it into the Secret Velero reads (gitops/apps/velero.yaml).
#
# How the operator signs in for Velero: as the cluster's machine identity, like for the app
# (chart/templates/infisicalauth.yaml), with the credential Terraform puts in the cluster (infra/platform).
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalAuth
metadata:
  name: velero
  namespace: velero
spec:
  infisicalConnectionRef:
    name: default
    namespace: infisical
  method: universal
  universal:
    clientIdRef:
      name: infisical-credentials
      namespace: infisical
      key: clientId
    clientSecretRef:
      name: infisical-credentials
      namespace: infisical
      key: clientSecret
---
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: velero-credentials
  namespace: velero
spec:
  infisicalAuthRef:
    name: velero
    namespace: velero
  syncOptions:
    refreshInterval: 60s
  sources:
    # The project of chart/values.yaml, its /aws folder.
    - projectSlug: cards-warehouse-g-ke-7
      environmentSlug: prod
      secretPath: /aws
  targets:
    # Owned by this resource: deleting it deletes the Secret too.
    - kind: Secret
      name: velero-credentials
      namespace: velero
      creationPolicy: Owner
      # Velero reads an AWS credentials file, in the key "cloud": the operator writes the two values into one.
      template:
        engineVersion: v1
        data:
          cloud: |
            [default]
            aws_access_key_id={{ .AWS_ACCESS_KEY_ID.Value }}
            aws_secret_access_key={{ .AWS_SECRET_ACCESS_KEY.Value }}
