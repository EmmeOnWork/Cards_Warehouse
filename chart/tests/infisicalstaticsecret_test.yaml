suite: the app's secrets, synced from Infisical
templates:
  - templates/infisicalstaticsecret.yaml
release:
  name: cards-warehouse
  namespace: cards-warehouse
tests:
  - it: reads the app's folder in the Infisical project and environment set in the values
    set:
      infisical:
        projectSlug: a-project
        environment: prod
        secretPath: /app
    asserts:
      - equal:
          path: spec.sources
          value:
            - projectSlug: a-project
              environmentSlug: prod
              secretPath: /app

  - it: writes them into the Secret the Deployment reads, owned by it and deleted with it
    asserts:
      - equal:
          path: spec.targets
          value:
            - kind: Secret
              name: cards-warehouse-secrets
              namespace: cards-warehouse
              creationPolicy: Owner

  - it: signs in to Infisical through the app's InfisicalAuth
    asserts:
      - equal:
          path: spec.infisicalAuthRef
          value: { name: cards-warehouse, namespace: cards-warehouse }

  - it: reads Infisical again at the interval set in the values, so a changed value reaches the cluster
    set:
      infisical.refreshInterval: 5m
    asserts:
      - equal:
          path: spec.syncOptions
          value: { refreshInterval: 5m }
