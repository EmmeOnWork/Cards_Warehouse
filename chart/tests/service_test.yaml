suite: the app's Service
templates:
  - templates/service.yaml
tests:
  - it: publishes the app on node port 30000, where the cluster maps port 8000 of the PC
    asserts:
      - equal:
          path: spec.type
          value: NodePort
      - equal:
          path: spec.ports[0].nodePort
          value: 30000
      - equal:
          path: spec.ports[0].targetPort
          value: http
