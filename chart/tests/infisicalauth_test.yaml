suite: how the operator signs in to Infisical for the app
templates:
  - templates/infisicalauth.yaml
release:
  name: cards-warehouse
  namespace: cards-warehouse
tests:
  - it: signs in with the client id and secret of the cluster identity, from the Secret named in the values
    set:
      infisical.credentials:
        name: some-credentials
        namespace: some-namespace
    asserts:
      - equal:
          path: spec.method
          value: universal
      - equal:
          path: spec.universal
          value:
            clientIdRef: { name: some-credentials, namespace: some-namespace, key: clientId }
            clientSecretRef: { name: some-credentials, namespace: some-namespace, key: clientSecret }

  - it: reaches Infisical through the connection named in the values
    set:
      infisical.connection:
        name: some-connection
        namespace: some-namespace
    asserts:
      - equal:
          path: spec.infisicalConnectionRef
          value: { name: some-connection, namespace: some-namespace }
