image:
  repository: ghcr.io/emmeonwork/cards-warehouse
  # The commit whose image runs, set by the Argo CD Application in gitops/apps.
  tag: ""

# The secrets the app needs, by name only: the values live in Infisical. Each one becomes
# an environment variable of the app, read from the Secret the Infisical operator fills.
secrets:
  - SESSION_SECRET # signs the sessions
  - PASSWORD_HASH # the Argon2 hash of the first password, and of a reset, from make password-hash: never the password itself
  - PGPASSWORD # the database's password: PostgreSQL sets it at its first start, the app connects with it
  # From the /aws folder (infisical.awsPath): the key of the scoped user cards-warehouse-app, the same Velero uses.
  - AWS_ACCESS_KEY_ID # puts, deletes and signs the links of the photos
  - AWS_SECRET_ACCESS_KEY

# The same, but the pod starts without them: until make ebay-connect, the eBay page says "Non collegato" (docs/ebay.md).
optionalSecrets:
  - EBAY_ENVIRONMENT # sandbox or production: which eBay the keys and the credential below belong to
  - EBAY_CLIENT_ID # the App ID of the keyset, from the developer portal
  - EBAY_CLIENT_SECRET # the Cert ID of the same keyset
  - EBAY_REFRESH_TOKEN # the durable credential, from make ebay-connect: with it the app asks for its short-lived tokens
  - EBAY_AUTHORIZATION_EXPIRES # when that credential ends, from make ebay-connect
  # From make ebay-setup: until they exist, a listing the app publishes on eBay says to run it.
  - EBAY_FULFILLMENT_POLICY_ID # the seller's shipping policy on eBay Italy, made by Manuel on eBay's page
  - EBAY_PAYMENT_POLICY_ID # the payment policy
  - EBAY_RETURN_POLICY_ID # the return policy
  - EBAY_LOCATION_KEY # the place the goods leave from

# Where those values live in Infisical Cloud.
infisical:
  # The address of Infisical: the connection declared in gitops/infisical/connection.yaml.
  connection:
    name: default
    namespace: infisical
  # A name, not a secret: from the project settings in Infisical.
  projectSlug: cards-warehouse-g-ke-7
  environment: prod
  secretPath: /app
  # The AWS key, kept apart since Velero reads it too (gitops/velero/credentials.yaml).
  awsPath: /aws
  # How often the operator reads Infisical again: a changed value reaches the cluster within it.
  refreshInterval: 60s
  # The credential of the cluster's identity, which Terraform puts in the cluster (infra/platform).
  credentials:
    name: infisical-credentials
    namespace: infisical

# Always written into the Deployment: without it, Argo CD could not tell that a hand change drifted from Git.
replicas: 1

service:
  # The kind cluster maps this node port to 127.0.0.1:8000 on the PC (infra/platform/cluster.tf).
  nodePort: 30000

# A failing liveness probe restarts the container; while readiness fails, the pod gets no traffic.
livenessProbe:
  httpGet:
    path: /livez
    port: http
readinessProbe:
  httpGet:
    path: /readyz
    port: http

# Measured on 2026-10-21: about 55 MiB after 600 requests to /readyz, each one asking the database
# (51 MiB on 2026-10-16, before the database). On 2026-10-23, 77 MiB after 34 logins: each one
# takes 19 MiB for Argon2 (app/src/cards_warehouse/password.py), one at a time. No CPU limit, so a burst is
# never throttled; the memory limit stops a leak before it hurts the rest of the PC.
# The migrations, which run before the app in the same pod, get the same.
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 128Mi

# The private bucket of the item photos, from the foundations (infra/foundations): a name, not a secret.
photos:
  bucket: emmeonwork-cards-warehouse-photos
  region: eu-north-1

# The database the app and its migrations connect to, and as whom.
database:
  name: cards_warehouse
  user: cards_warehouse

# PostgreSQL in the cluster (templates/postgres.yaml). The version the tests run against too (app/tests).
postgres:
  image: postgres:18.6-trixie
  # A volume on the kind node: it outlives the pod, not the cluster.
  storage: 1Gi
  # Measured on 2026-10-21: 34 MiB idle, 234 MiB after a pgbench run on a million rows, far more than
  # the app will hold, with its 128 MiB of shared buffers full. No CPU limit, as for the app.
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
