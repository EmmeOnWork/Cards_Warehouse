# The Infisical operator copies the app's secrets from Infisical into a Kubernetes Secret.
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: {{ .Release.Name }}
spec:
  # Defined in infisicalauth.yaml.
  infisicalAuthRef:
    name: {{ .Release.Name }}
    namespace: {{ .Release.Namespace }}
  # Polling: instant updates pushed by Infisical are an Enterprise feature.
  syncOptions:
    refreshInterval: {{ .Values.infisical.refreshInterval }}
  # Both folders merged into the one Secret.
  sources:
    - projectSlug: {{ .Values.infisical.projectSlug }}
      environmentSlug: {{ .Values.infisical.environment }}
      secretPath: {{ .Values.infisical.secretPath }}
    - projectSlug: {{ .Values.infisical.projectSlug }}
      environmentSlug: {{ .Values.infisical.environment }}
      secretPath: {{ .Values.infisical.awsPath }}
  targets:
    # Owned by this resource: deleting it deletes the Secret too, instead of leaving copies behind.
    - kind: Secret
      name: {{ include "cards-warehouse.secretName" . }}
      namespace: {{ .Release.Namespace }}
      creationPolicy: Owner
