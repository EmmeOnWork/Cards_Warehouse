apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  annotations:
    # The app reads its secrets only at start: the operator restarts it when one changes in Infisical.
    secrets.infisical.com/auto-reload: "true"
spec:
  replicas: {{ .Values.replicas }}
  # A new version gets a pod of its own, and the old pod is removed only once the new one is Ready:
  # if the migrations fail, the new pod never gets Ready, and the version already running keeps serving.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "cards-warehouse.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cards-warehouse.selectorLabels" . | nindent 8 }}
    spec:
      # The app never calls the Kubernetes API: no token to steal.
      automountServiceAccountToken: false
      # The restricted Pod Security Standard, enforced by the namespace: the image runs as
      # the numeric user 10001, so Kubernetes can check that it is not root.
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      # Before the app starts, from the same image: brings the database to the last migration of this version.
      # On a new cluster it can start before the database is ready, fail, and be started again by Kubernetes.
      initContainers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ required "image.tag: the commit to run" .Values.image.tag }}"
          command: [python, -m, cards_warehouse.migrate]
          securityContext:
            {{- include "cards-warehouse.containerSecurityContext" . | nindent 12 }}
          env:
            {{- include "cards-warehouse.appEnv" . | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ required "image.tag: the commit to run" .Values.image.tag }}"
          securityContext:
            {{- include "cards-warehouse.containerSecurityContext" . | nindent 12 }}
          env:
            {{- include "cards-warehouse.appEnv" . | nindent 12 }}
          ports:
            - name: http
              containerPort: 8000
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
