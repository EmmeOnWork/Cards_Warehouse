apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  annotations:
    # The app reads its secrets only at start: the operator restarts it when one changes in Infisical.
    secrets.infisical.com/auto-reload: "true"
spec:
  replicas: {{ .Values.replicas }}
  # A new version gets a pod of its own, and the old pod is removed only once the new one is Ready:
  # if the migrations fail, the new pod never gets Ready, and the version already running keeps serving.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "cards-warehouse.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cards-warehouse.selectorLabels" . | nindent 8 }}
    spec:
      # Its token lets the app list Velero's backups, and nothing else (backup-reader.yaml).
      serviceAccountName: {{ .Release.Name }}
      automountServiceAccountToken: true
      # The restricted Pod Security Standard, enforced by the namespace: the image runs as
      # the numeric user 10001, so Kubernetes can check that it is not root.
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      # Before the app starts, from the same image: brings the database to the last migration of this version.
      # On a new cluster it can start before the database is ready, fail, and be started again by Kubernetes.
      initContainers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ required "image.tag: the commit to run" .Values.image.tag }}"
          command: [python, -m, cards_warehouse.migrate]
          securityContext:
            {{- include "cards-warehouse.containerSecurityContext" . | nindent 12 }}
          env:
            {{- include "cards-warehouse.appEnv" . | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ required "image.tag: the commit to run" .Values.image.tag }}"
          securityContext:
            {{- include "cards-warehouse.containerSecurityContext" . | nindent 12 }}
          env:
            {{- include "cards-warehouse.appEnv" . | nindent 12 }}
          ports:
            - name: http
              containerPort: 8000
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        # The only place the app writes: an uploaded file over 1 MB waits here until it is sent to S3, since the
        # root filesystem is read-only. On the node's disk, not in memory, so a photo never counts against the
        # memory limit. Room for a batch of 25 photos at the 20 MB limit (photo_pages.py).
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
