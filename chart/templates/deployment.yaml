apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "cards-warehouse.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cards-warehouse.selectorLabels" . | nindent 8 }}
    spec:
      # The app never calls the Kubernetes API: no token to steal.
      automountServiceAccountToken: false
      # The restricted Pod Security Standard, enforced by the namespace: the image runs as
      # the numeric user 10001, so Kubernetes can check that it is not root.
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ required "image.tag: the commit to run" .Values.image.tag }}"
          imagePulPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          ports:
            - name: http
              containerPort: 8000
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
