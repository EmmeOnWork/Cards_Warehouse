apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  annotations:
    # The app reads its secrets only at start: the operator restarts it when one changes in Infisical.
    secrets.infisical.com/auto-reload: "true"
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "cards-warehouse.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cards-warehouse.selectorLabels" . | nindent 8 }}
    spec:
      # The app never calls the Kubernetes API: no token to steal.
      automountServiceAccountToken: false
      # The restricted Pod Security Standard, enforced by the namespace: the image runs as
      # the numeric user 10001, so Kubernetes can check that it is not root.
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ required "image.tag: the commit to run" .Values.image.tag }}"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          # A key missing from the Secret keeps the pod from starting, and the pod events name it.
          env:
            {{- range .Values.secrets }}
            - name: {{ . }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "cards-warehouse.secretName" $ }}
                  key: {{ . }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8000
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
